name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Publier l'APK (Release + branche apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/LecteurEcran.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest /tmp/LecteurEcran.apk --title "Lecteur d'ecran (APK)" --notes "Telecharge LecteurEcran.apk puis ouvre-le sur ton telephone."
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/LecteurEcran.apk .
          git add LecteurEcran.apk
          git commit -q -m "APK"
          git push -f origin apk
